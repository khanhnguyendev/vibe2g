<svg width="200" height="50" viewBox="0 0 200 50" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#8b5cf6" />
            <stop offset="50%" style="stop-color:#ec4899" />
            <stop offset="100%" style="stop-color:#f97316" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- Abstract V Icon -->
    <path d="M20 10 L30 40 L40 10" stroke="url(#neonGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    
    <!-- Text -->
    <text x="50" y="35" font-family="'Outfit', sans-serif" font-weight="bold" font-size="28" fill="url(#neonGrad)" filter="url(#glow)">
        vibe2g
    </text>
</svg>
