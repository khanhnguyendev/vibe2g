<svg width="250" height="60" viewBox="0 0 250 60" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Neon Gradients -->
        <linearGradient id="neonV" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#c084fc" /> <!-- violet-400 -->
            <stop offset="100%" style="stop-color:#e879f9" /> <!-- fuchsia-400 -->
        </linearGradient>
        
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#ffffff" />
            <stop offset="100%" style="stop-color:#e2e8f0" />
        </linearGradient>

        <!-- Glow Filter -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <!-- Subtle Text Shadow -->
        <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
             <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
             <feOffset dx="0" dy="0" result="offsetblur"/>
             <feFlood flood-color="#c084fc" flood-opacity="0.5"/>
             <feComposite in2="offsetblur" operator="in"/>
             <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Logo Icon (Abstract V) -->
    <g transform="translate(10, 5) scale(0.9)" filter="url(#glow)">
        <path d="M10 5 L25 45 L40 5" 
              stroke="url(#neonV)" 
              stroke-width="5" 
              stroke-linecap="round" 
              stroke-linejoin="round"
              fill="none" />
        <path d="M18 10 L25 30 L32 10" 
              stroke="white" 
              stroke-width="2" 
              stroke-linecap="round" 
              stroke-linejoin="round"
              opacity="0.8"
              fill="none" />
    </g>

    <!-- Wordmark -->
    <text x="60" y="40" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="800" 
          font-size="32" 
          fill="url(#textGrad)"
          filter="url(#textGlow)"
          letter-spacing="-0.5">
        Vibe2G
    </text>
</svg>
